services:
  db:
    image: postgres:16-alpine
    ports:
      # Bound to loopback only: this is a dev-only Postgres instance with a
      # fixed default password, not something to expose to the LAN.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_tree_dev
    volumes:
      - money_tree_db_data:/var/lib/postgresql/data
    env_file:
      - .env

  openbao:
    image: ghcr.io/openbao/openbao:2.5.4
    cap_add:
      - IPC_LOCK
    ports:
      # Bound to loopback only. This local instance uses plaintext HTTP and
      # must never be exposed beyond the development machine.
      - "127.0.0.1:8200:8200"
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    command: server -config=/openbao/config/dev.hcl
    volumes:
      - ./config/openbao/dev.hcl:/openbao/config/dev.hcl:ro
      - money_tree_openbao_data:/openbao/file
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  money_tree_db_data:
    driver: local
  money_tree_openbao_data:
    driver: local
