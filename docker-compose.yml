services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_tree_dev
    volumes:
      - money_tree_db_data:/var/lib/postgresql/data
    env_file:
      - .env

  openbao:
    image: ghcr.io/openbao/openbao:2.5.4
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      BAO_DEV_ROOT_TOKEN_ID: moneytree-dev-root-token
    command: server -dev
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  money_tree_db_data:
    driver: local
